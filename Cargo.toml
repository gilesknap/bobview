[workspace]
resolver = "3"
members = ["crates/bob", "crates/pv", "crates/bobview", "crates/bobview-server", "crates/testioc"]

[workspace.package]
version = "1.9.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gilesknap/bobview"
homepage = "https://gilesknap.github.io/bobview/"

# The crates bobview and bobview-server use from this workspace. `bob` and
# `pv` were taken on crates.io, so they are published as bobview-bob and
# bobview-pv (and testioc as bobview-testioc), and keep their names in code. The versions match the
# workspace's, as crates.io needs.
[workspace.dependencies]
bob = { package = "bobview-bob", path = "crates/bob", version = "=1.9.0" }
pv = { package = "bobview-pv", path = "crates/pv", version = "=1.9.0" }
# The trend windows' plot (archived and live PVs): the library only, with
# no eframe, clap or clipboard.
archiveview = { version = "0.2.0", default-features = false }

# archiveview's `Plot` takes a crates.io `bobview_pv::PvManager`: this makes
# it the in-tree crate, so it is the same type as bobview's.
[patch.crates-io]
bobview-pv = { path = "crates/pv" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
