[workspace]
resolver = "3"
members = ["crates/bob", "crates/pv", "crates/bobview", "crates/bobview-server", "crates/testioc"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gilesknap/bobview"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
