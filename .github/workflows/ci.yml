name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Snapshot the test displays against bobview-testioc
        env:
          EPICS_CA_ADDR_LIST: 127.0.0.1
          EPICS_CA_AUTO_ADDR_LIST: "NO"
        run: |
          cargo build --workspace
          target/debug/bobview-testioc &
          mkdir -p snapshots
          for f in tests/displays/*.bob; do
            target/debug/bobview --snapshot "snapshots/$(basename "$f" .bob).png" \
              --size 1280x800 --wait 5 "$f"
          done
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Package
        run: ./scripts/package.sh bobview-aarch64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: bobview-aarch64-linux
          path: bobview-aarch64-linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bobview-aarch64-linux
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" bobview-aarch64-linux.tar.gz \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
