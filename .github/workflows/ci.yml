name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # the [workspace.package] version, ignoring any other version keys
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Snapshot the test displays against bobview-testioc
        env:
          EPICS_CA_ADDR_LIST: 127.0.0.1
          EPICS_CA_AUTO_ADDR_LIST: "NO"
          EPICS_PVA_ADDR_LIST: 127.0.0.1
          EPICS_PVA_AUTO_ADDR_LIST: "NO"
        run: |
          cargo build --workspace
          target/debug/bobview-testioc &
          mkdir -p snapshots
          for f in tests/displays/*.bob; do
            target/debug/bobview --snapshot "snapshots/$(basename "$f" .bob).png" \
              --size 1280x800 --wait 5 "$f"
          done
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots

  build:
    # release builds for each arch on a native runner, packaged as
    # bobview-<arch>-linux. cargo-zigbuild links against glibc 2.28 so the
    # binaries also run on older distributions (e.g. RHEL 8), not just the
    # runner's Ubuntu 24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-gnu
      GLIBC: "2.28"
      TARGET_DIR: target/${{ matrix.arch }}-unknown-linux-gnu/release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --workspace --target ${TARGET}.${GLIBC}
      - name: Check the glibc requirement
        run: |
          for b in bobview bobview-probe bobview-testioc; do
            need=$(objdump -T ${TARGET_DIR}/$b | grep -oE "GLIBC_[0-9.]+" | sort -Vu | tail -1)
            echo "$b needs $need"
            [ "$(printf "%s\n" "$need" "GLIBC_${GLIBC}" | sort -V | tail -1)" = "GLIBC_${GLIBC}" ]
          done
      - name: Smoke test the ${{ matrix.arch }} binaries
        env:
          EPICS_CA_ADDR_LIST: 127.0.0.1
          EPICS_CA_AUTO_ADDR_LIST: "NO"
        run: |
          ${TARGET_DIR}/bobview --version
          ${TARGET_DIR}/bobview-testioc &
          ${TARGET_DIR}/bobview-probe --seconds 3 bl01t:SUM BL01T-MO-SIMC-01:M1.RBV | tee probe.txt
          grep -q "bl01t:SUM .*5" probe.txt
          EPICS_PVA_ADDR_LIST=127.0.0.1 EPICS_PVA_AUTO_ADDR_LIST=NO \
            ${TARGET_DIR}/bobview-probe --seconds 3 pva://bl01t:SUM pva://BL01T-DI-CAM-01:PVA:OUTPUT | tee pva.txt
          grep -q "OUTPUT .*1024x1024 image" pva.txt
          mkdir -p snapshots
          ${TARGET_DIR}/bobview --snapshot snapshots/index-${{ matrix.arch }}.png --size 800x600 --wait 5 tests/displays/index.bob
          EPICS_PVA_ADDR_LIST=127.0.0.1 EPICS_PVA_AUTO_ADDR_LIST=NO \
            ${TARGET_DIR}/bobview --snapshot snapshots/demo-${{ matrix.arch }}.png --size 1300x780 --wait 5 tests/displays/demo.bob
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.arch }}
          path: snapshots
      - name: Package
        run: ./scripts/package.sh bobview-${{ matrix.arch }}-linux
      - uses: actions/upload-artifact@v4
        with:
          name: bobview-${{ matrix.arch }}-linux
          path: bobview-${{ matrix.arch }}-linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bobview-*-linux
          merge-multiple: true
      - name: Create the release, or add the binaries to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release made in the GitHub UI creates the tag too, so the
          # release may already exist when this tag build runs
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" bobview-*-linux.tar.gz \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" bobview-*-linux.tar.gz \
              --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
