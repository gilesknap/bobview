name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Snapshot the test displays against bobview-testioc
        env:
          EPICS_CA_ADDR_LIST: 127.0.0.1
          EPICS_CA_AUTO_ADDR_LIST: "NO"
          EPICS_PVA_ADDR_LIST: 127.0.0.1
          EPICS_PVA_AUTO_ADDR_LIST: "NO"
        run: |
          cargo build --workspace
          target/debug/bobview-testioc &
          mkdir -p snapshots
          for f in tests/displays/*.bob; do
            target/debug/bobview --snapshot "snapshots/$(basename "$f" .bob).png" \
              --size 1280x800 --wait 5 "$f"
          done
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Smoke test the aarch64 binaries
        env:
          EPICS_CA_ADDR_LIST: 127.0.0.1
          EPICS_CA_AUTO_ADDR_LIST: "NO"
        run: |
          target/release/bobview --version
          target/release/bobview-testioc &
          target/release/bobview-probe --seconds 3 bl01t:SUM BL01T-MO-SIMC-01:M1.RBV | tee probe.txt
          grep -q "bl01t:SUM .*5" probe.txt
          EPICS_PVA_ADDR_LIST=127.0.0.1 EPICS_PVA_AUTO_ADDR_LIST=NO \
            target/release/bobview-probe --seconds 3 pva://bl01t:SUM pva://BL01T-DI-CAM-01:PVA:OUTPUT | tee pva.txt
          grep -q "OUTPUT .*1024x1024 image" pva.txt
          mkdir -p snapshots
          target/release/bobview --snapshot snapshots/index-arm64.png --size 800x600 --wait 5 tests/displays/index.bob
          EPICS_PVA_ADDR_LIST=127.0.0.1 EPICS_PVA_AUTO_ADDR_LIST=NO \
            target/release/bobview --snapshot snapshots/demo-arm64.png --size 1300x780 --wait 5 tests/displays/demo.bob
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-arm64
          path: snapshots
      - name: Package
        run: ./scripts/package.sh bobview-aarch64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: bobview-aarch64-linux
          path: bobview-aarch64-linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bobview-aarch64-linux
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" bobview-aarch64-linux.tar.gz \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
