name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy the browser build
        run: cargo clippy -p bobview-pv -p bobview --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - name: Snapshot the test displays against bobview-testioc
        env:
          EPICS_CA_ADDR_LIST: 127.0.0.1
          EPICS_CA_AUTO_ADDR_LIST: "NO"
          EPICS_PVA_ADDR_LIST: 127.0.0.1
          EPICS_PVA_AUTO_ADDR_LIST: "NO"
        run: |
          cargo build --workspace
          target/debug/bobview-testioc &
          mkdir -p snapshots
          for f in tests/displays/*.bob; do
            target/debug/bobview --snapshot "snapshots/$(basename "$f" .bob).png" \
              --size 1280x800 --wait 5 "$f"
          done
          kill %1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshots
          path: snapshots

  build:
    # release builds for each platform on a native runner, packaged as
    # bobview-<arch>-<os>. On Linux cargo-zigbuild links against glibc 2.28
    # so the binaries also run on older distributions (e.g. RHEL 8), not just
    # the runner's Ubuntu 24.04. The macOS builds run on the arm64 runner;
    # x86_64 is cross-built there, so only arm64 is smoke tested. Windows is
    # built with MSVC, tested (the check job tests only Linux) and packaged
    # as a zip; its steps run in Git Bash.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            platform: linux
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            os: ubuntu-24.04-arm
            platform: linux
            target: aarch64-unknown-linux-gnu
          - arch: aarch64
            os: macos-15
            platform: macos
            target: aarch64-apple-darwin
          - arch: x86_64
            os: macos-15
            platform: macos
            target: x86_64-apple-darwin
            cross: true
          - arch: x86_64
            os: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      GLIBC: "2.28"
      TARGET_DIR: target/${{ matrix.target }}/release
      LICENSE_TARGET: ${{ matrix.target }}
      # the oldest macOS the binaries run on
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Python on Windows is python, not python3
      PYTHON: ${{ matrix.platform == 'windows' && 'python' || 'python3' }}
      PACKAGE: bobview-${{ matrix.arch }}-${{ matrix.platform }}.${{ matrix.archive || 'tar.gz' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: matrix.platform == 'linux'
      - name: Find the wasm-bindgen version in Cargo.lock
        run: |
          echo "WASM_BINDGEN=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: ${{ matrix.platform == 'linux' && 'cargo-zigbuild, ' || '' }}wasm-bindgen@${{ env.WASM_BINDGEN }}
      - name: Check the release tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        # crates.io takes the version from Cargo.toml, so the tag must match it
        run: |
          V=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "v${V}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${V} in Cargo.toml"
            exit 1
          fi
      - if: matrix.platform == 'linux'
        run: cargo zigbuild --release --workspace --target ${TARGET}.${GLIBC}
      - if: matrix.platform != 'linux'
        run: cargo build --release --workspace --target ${TARGET}
      - name: Test on Windows
        if: matrix.platform == 'windows'
        run: cargo test --release --workspace --no-fail-fast --target ${TARGET}
      - name: Sign the macOS binaries ad hoc
        # arm64 macOS will not run unsigned code, and stripping can leave the
        # linker's signature invalid; ad hoc signing needs no certificate
        if: matrix.platform == 'macos'
        run: |
          for b in bobview bobview-probe bobview-testioc bobview-server; do
            codesign --force --sign - ${TARGET_DIR}/$b
          done
      - name: Build the browser bundle
        run: ./scripts/build-web.sh
      - name: Check the glibc requirement
        if: matrix.platform == 'linux'
        run: |
          for b in bobview bobview-probe bobview-testioc bobview-server; do
            need=$(objdump -T ${TARGET_DIR}/$b | grep -oE "GLIBC_[0-9.]+" | sort -Vu | tail -1)
            echo "$b needs $need"
            [ "$(printf "%s\n" "$need" "GLIBC_${GLIBC}" | sort -V | tail -1)" = "GLIBC_${GLIBC}" ]
          done
      - name: Check the macOS requirement
        if: matrix.platform == 'macos'
        run: |
          for b in bobview bobview-probe bobview-testioc bobview-server; do
            lipo -archs ${TARGET_DIR}/$b
            otool -l ${TARGET_DIR}/$b | grep -A3 LC_BUILD_VERSION | grep -q "minos ${MACOSX_DEPLOYMENT_TARGET}"
            codesign --verify ${TARGET_DIR}/$b
          done
      - name: Smoke test the ${{ matrix.arch }}-${{ matrix.platform }} binaries
        if: ${{ !matrix.cross }}
        env:
          EPICS_CA_ADDR_LIST: 127.0.0.1
          EPICS_CA_AUTO_ADDR_LIST: "NO"
        run: |
          ${TARGET_DIR}/bobview --version | tee version.txt
          ${TARGET_DIR}/bobview-server --version | tee -a version.txt
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            grep -qx "bobview ${GITHUB_REF_NAME#v}" version.txt
            grep -qx "bobview-server ${GITHUB_REF_NAME#v}" version.txt
          fi
          ${TARGET_DIR}/bobview-testioc &
          ${TARGET_DIR}/bobview-probe --seconds 3 bl01t:SUM BL01T-MO-SIMC-01:M1.RBV | tee probe.txt
          grep -q "bl01t:SUM .*5" probe.txt
          EPICS_PVA_ADDR_LIST=127.0.0.1 EPICS_PVA_AUTO_ADDR_LIST=NO \
            ${TARGET_DIR}/bobview-probe --seconds 3 pva://bl01t:SUM pva://BL01T-DI-CAM-01:PVA:OUTPUT | tee pva.txt
          grep -q "OUTPUT .*1024x1024 image" pva.txt
          mkdir -p snapshots
          ${TARGET_DIR}/bobview --snapshot snapshots/index-${{ matrix.arch }}.png --size 800x600 --wait 5 tests/displays/index.bob
          EPICS_PVA_ADDR_LIST=127.0.0.1 EPICS_PVA_AUTO_ADDR_LIST=NO \
            ${TARGET_DIR}/bobview --snapshot snapshots/demo-${{ matrix.arch }}.png --size 1300x780 --wait 5 tests/displays/demo.bob
          kill %1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !matrix.cross }}
        with:
          name: snapshots-${{ matrix.arch }}-${{ matrix.platform }}
          path: snapshots
      - name: Package
        run: ./scripts/package.sh bobview-${{ matrix.arch }}-${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bobview-${{ matrix.arch }}-${{ matrix.platform }}
          path: ${{ env.PACKAGE }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bobview-*
          merge-multiple: true
      - name: Checksum the release files
        run: sha256sum bobview-*.tar.gz bobview-*.zip > SHA256SUMS
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            bobview-*.tar.gz
            bobview-*.zip
      - name: Create the release, or add the binaries to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release made in the GitHub UI creates the tag too, so the
          # release may already exist when this tag build runs
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" bobview-*.tar.gz bobview-*.zip SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" bobview-*.tar.gz bobview-*.zip SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi

  publish:
    # Publish the crates to crates.io with trusted publishing (no stored
    # token). Turned on by the repository variable PUBLISH_CRATES=true, once
    # the crates exist on crates.io and each lists this workflow as a trusted
    # publisher; see docs/src/how-to/release.md.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CRATES == 'true'
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
