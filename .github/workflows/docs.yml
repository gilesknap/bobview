name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Pushes publish to gh-pages one at a time, so that a release's main and tag
# runs don't each write switcher.json from the same old copy; PR runs only
# build, and a newer push to the PR cancels the last.
concurrency:
  group: docs-${{ github.event_name == 'push' && 'gh-pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  docs:
    # The mdBook in docs/, with rustdoc for the workspace under api/, built
    # into a folder per version on the gh-pages branch (main and each v*
    # tag), as in python-copier-template. switcher.json lists the versions
    # for the menu in the docs' top bar; the root redirects to main/.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          # mdbook-mermaid 0.15 is built for mdBook 0.4.36 and later 0.4s
          tool: mdbook@0.4.40,mdbook-mermaid@0.15.0

      - name: Sanitize ref name for docs version
        run: echo "DOCS_VERSION=${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}" >> "$GITHUB_ENV"

      - name: Build the book and the API docs
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: /${{ github.event.repository.name }}/${{ env.DOCS_VERSION }}/
        run: |
          scripts/build-docs.sh
          # the book's links to the API docs
          for crate in bob pv testioc bobview bobview_server bobview_probe bobview_testioc; do
            test -f "docs/book/api/${crate}/index.html"
          done
          # the diagrams: Mermaid's script, and a diagram it has to draw
          test -s docs/book/theme/mermaid.min.js
          grep -q 'theme/mermaid-init.js' docs/book/explanations/architecture.html
          grep -q '<pre class="mermaid">' docs/book/explanations/architecture.html

      - name: Move to versioned directory
        run: |
          mv docs/book ".github/pages/${DOCS_VERSION}"

      - name: Write switcher.json
        if: github.event_name == 'push'
        run: python3 .github/pages/make_switcher.py --add "${DOCS_VERSION}" "${{ github.repository }}" .github/pages/switcher.json

      - name: Publish docs to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .github/pages
          keep_files: true
