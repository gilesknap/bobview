[package]
name = "bobview-testioc"
description = "Pure-Rust CA and PVA test IOC serving the example-services BL01T PVs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["epics", "channel-access", "pv-access", "ioc", "simulation"]
categories = ["simulation", "science"]

[lib]
name = "testioc"

[[bin]]
name = "bobview-testioc"
path = "src/main.rs"

[dependencies]
asyn-rs = "0.31.0"
epics-base-rs = "0.31.0"
epics-ca-rs = "0.31.0"
epics-pva-rs = { version = "0.31.0", default-features = false }
motor-rs = "0.31.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
epics-pva-rs = { version = "0.31.0", default-features = false, features = ["client"] }
png = "0.18.1"
