[package]
name = "pv"
description = "PV access layer for bobview: CA, PVA, loc:// and sim:// behind one interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
epics-base-rs = "0.31.0"
epics-ca-rs = "0.31.0"
epics-pva-rs = { version = "0.31.0", default-features = false, features = ["client"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# In a browser, PVs other than loc:// and sim:// come over a PV Web Socket (PVWS).
[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["WebSocket", "MessageEvent", "Window", "Location", "Url"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
testioc = { path = "../testioc" }
