[package]
name = "bobview"
description = "A lean viewer for Phoebus Display Builder .bob and CS-Studio BOY .opi screens, with live EPICS PVs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["epics", "phoebus", "cs-studio", "control-system", "egui"]
categories = ["gui", "science", "visualization"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.36.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
log = "0.4.34"
bob.workspace = true
pv.workspace = true
png = "0.18.1"
imagesize = "0.15"
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }
# The versions usvg uses, to read an SVG's references before usvg does.
roxmltree = "0.21.1"
simplecss = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
parking_lot = "0.12.5"
web-time = "1.1.0"
archiveview.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
libc = "0.2.190"

# A mock Archiver Appliance, for testing that trends show its history.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
archiveview-mockarchiver = "0.2.2"

# The primary selection, which a middle-click pastes, where there is one
# (X11 and Wayland); egui sets only the clipboard. The version egui-winit
# uses, with Wayland's data-control protocol (falling back to XWayland).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

# The browser build: see web/index.html.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Local time for trend axes from the browser's time zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "console", "Document", "History", "HtmlCanvasElement", "Location", "Response", "Url",
    "UrlSearchParams", "Window",
] }
